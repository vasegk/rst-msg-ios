name: RST
options:
  bundleIdPrefix: ru.rstmsg
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  RST:
    type: application
    platform: iOS
    sources:
      - path: RST
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.rstmsg.messenger
        PRODUCT_NAME: RST
        INFOPLIST_FILE: RST/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: NO

  RSTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RSTTests
    dependencies:
      - target: RST
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.rstmsg.messenger.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RST.app/RST"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  RST:
    build:
      targets:
        RST: all
        RSTTests: [test]
    test:
      targets:
        - RSTTests
      gatherCoverageData: false
